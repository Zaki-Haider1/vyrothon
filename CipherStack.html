<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CipherStack — Cascade Encryption Builder</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--bg2:#0d1220;--bg3:#111828;--bg4:#161e30;
  --border:#1e2d4a;--border2:#2a3d60;
  --gold:#c9a84c;--gold2:#e8c96a;--gold3:#7a6030;
  --cyan:#00d4ff;--cyan2:#0088aa;
  --green:#00e676;--green2:#00995a;
  --red:#ff4455;--purple:#9966ff;--orange:#ff8844;
  --text:#dde4f5;--text2:#7a90bb;--text3:#3a4d70;
  --mono:'Courier New',Courier,monospace;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);overflow:hidden}
#app{display:grid;grid-template-rows:56px 1fr;grid-template-columns:260px 1fr 300px;height:100vh;overflow:hidden}

header{
  grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;background:var(--bg2);border-bottom:1px solid var(--border);
  position:relative;z-index:10;
}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold3),var(--cyan2),var(--gold3),transparent)}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:32px;height:32px;flex-shrink:0}
.logo-text{font-size:17px;font-weight:700;letter-spacing:4px;
  background:linear-gradient(135deg,var(--gold2),var(--gold),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-sub{font-size:8px;letter-spacing:3px;color:var(--text3);text-transform:uppercase}
.mode-group{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px}
.mode-btn{padding:5px 16px;border:none;border-radius:4px;font-family:var(--mono);font-size:10px;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;background:transparent;color:var(--text3);transition:all .2s}
.mode-btn.enc-on{background:linear-gradient(135deg,#00995a,#00e676);color:#000;font-weight:700;box-shadow:0 0 12px #00e67644}
.mode-btn.dec-on{background:linear-gradient(135deg,#aa0022,#ff4455);color:#fff;font-weight:700;box-shadow:0 0 12px #ff445544}
.hdr-btns{display:flex;gap:6px}
.hdr-btn{padding:5px 12px;background:transparent;border:1px solid var(--border2);border-radius:4px;
  color:var(--text2);font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.hdr-btn:hover{border-color:var(--gold);color:var(--gold)}
.hdr-btn.red:hover{border-color:var(--red);color:var(--red)}

.panel-left{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel-title{padding:12px 16px;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.ptdot{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold);
  animation:blink 2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.lib-scroll{flex:1;overflow-y:auto;padding:8px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

.cipher-chip{margin-bottom:6px;border:1px solid var(--border);border-radius:6px;background:var(--bg3);
  cursor:pointer;transition:all .15s;overflow:hidden}
.cipher-chip:hover{border-color:var(--border2);transform:translateX(2px)}
.chip-head{display:flex;align-items:center;gap:8px;padding:8px 10px}
.chip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chip-name{font-size:11px;font-weight:700;flex:1;color:var(--text)}
.chip-tag{font-size:8px;padding:1px 5px;border-radius:2px;letter-spacing:1px;text-transform:uppercase}
.tag-cfg{background:rgba(201,168,76,.15);color:var(--gold)}
.tag-free{background:rgba(122,144,187,.1);color:var(--text2)}
.chip-plus{width:20px;height:20px;border-radius:50%;background:transparent;border:1px solid var(--border2);
  color:var(--text2);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.chip-plus:hover{background:var(--gold);border-color:var(--gold);color:#000}
.chip-desc{padding:0 10px 8px 25px;font-size:9px;color:var(--text3);line-height:1.5}

.stats-box{padding:10px 12px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:6px;text-align:center}
.stat-n{font-size:18px;font-weight:700;line-height:1}
.stat-l{font-size:8px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.stat-full{grid-column:1/-1}
.cyan-n{color:var(--cyan)}.gold-n{color:var(--gold)}.green-n{color:var(--green)}.red-n{color:var(--red)}

.canvas{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.canvas-inner{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;align-items:center}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:10px;opacity:.35;text-align:center;width:100%}
.empty-ico{font-size:40px}
.empty-txt{font-size:11px;color:var(--text3);letter-spacing:1px;line-height:1.9}
.pipe{width:100%;max-width:600px;display:flex;flex-direction:column;align-items:center}

.node-wrap{width:100%;animation:nin .2s ease-out}
@keyframes nin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.node-card{border:1px solid var(--border);border-radius:8px;background:var(--bg3);width:100%;overflow:hidden;transition:border-color .2s}
.node-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none}
.nnum{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;border:1px solid}
.ntitle{font-size:12px;font-weight:700;flex:1}
.nbadge{font-size:8px;padding:1px 5px;border-radius:2px;text-transform:uppercase;letter-spacing:1px}
.nio-prev{font-size:9px;padding:1px 6px;border-radius:2px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);color:var(--cyan2);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbtns{display:flex;gap:3px}
.nbtn{width:24px;height:24px;border-radius:3px;background:transparent;border:1px solid var(--border);color:var(--text3);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.nbtn:hover{border-color:var(--border2);color:var(--text)}
.nbtn:disabled{opacity:.25;cursor:not-allowed}
.nbtn.del:hover{border-color:var(--red);color:var(--red)}
.nchev{font-size:9px;transition:transform .2s;color:var(--text3);flex-shrink:0}

.node-body{border-top:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:10px}
.cfg-row{display:flex;flex-direction:column;gap:3px}
.cfg-lbl{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--text3)}
.cfg-in{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 8px;font-family:var(--mono);font-size:11px;color:var(--text);width:100%;outline:none;transition:border-color .2s}
.cfg-in:focus{border-color:var(--border2)}
.cfg-in[type=range]{padding:3px 0;accent-color:var(--gold);cursor:pointer}

.io-pane{background:var(--bg);border:1px solid var(--border);border-radius:5px;overflow:hidden}
.io-tabs{display:flex;border-bottom:1px solid var(--border)}
.io-tab{flex:1;padding:5px;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);text-align:center}
.io-tab.first{border-right:1px solid var(--border)}
.io-tab.lit{color:var(--cyan2)}
.io-vals{display:grid;grid-template-columns:1fr 1fr}
.io-val{padding:6px 8px;font-size:9px;min-height:36px;word-break:break-all;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.io-val.iin{border-right:1px solid var(--border);color:var(--cyan2)}
.io-val.iout{color:var(--green2)}
.io-val.dim{color:var(--text3);font-style:italic}

.conn{display:flex;flex-direction:column;align-items:center;height:28px}
.conn-line{width:2px;flex:1;background:linear-gradient(to bottom,var(--border2),var(--border));position:relative;overflow:hidden}
.conn-line::after{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(to bottom,var(--cyan),transparent);animation:flow 1s ease-in-out infinite}
@keyframes flow{0%{transform:translateY(-6px);opacity:0}100%{transform:translateY(8px);opacity:.7}}
.conn-arr{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--border2)}

.io-bar{border-top:1px solid var(--border);background:var(--bg2);padding:10px 16px;display:grid;grid-template-columns:1fr 60px 1fr;gap:10px;align-items:center}
.io-sect{display:flex;flex-direction:column;gap:5px}
.io-lbl{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:5px;justify-content:space-between}
.io-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.io-area{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:8px;font-family:var(--mono);font-size:11px;color:var(--text);width:100%;resize:none;outline:none;line-height:1.6;height:64px;transition:border-color .2s}
.io-area:focus{border-color:var(--border2)}
.out-enc{color:var(--green);border-color:rgba(0,230,118,.15)}
.out-dec{color:var(--cyan);border-color:rgba(0,212,255,.15)}
.in-dec{color:var(--red);border-color:rgba(255,68,85,.15)}
.run-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.run-btn{width:48px;height:48px;border-radius:50%;border:2px solid;background:transparent;font-size:16px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.run-btn.enc{border-color:var(--green);color:var(--green);box-shadow:0 0 12px rgba(0,230,118,.3)}
.run-btn.enc:hover{background:rgba(0,230,118,.1);transform:scale(1.08)}
.run-btn.dec{border-color:var(--red);color:var(--red);box-shadow:0 0 12px rgba(255,68,85,.3)}
.run-btn.dec:hover{background:rgba(255,68,85,.1);transform:scale(1.08)}
.run-btn:disabled{opacity:.3;cursor:not-allowed;transform:none!important}
.run-lbl{font-size:7px;letter-spacing:2px;text-transform:uppercase;color:var(--text3)}
.copy-btn{font-size:8px;padding:2px 8px;background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--text3);cursor:pointer;transition:all .2s;font-family:var(--mono)}
.copy-btn:hover{border-color:var(--gold);color:var(--gold)}

.panel-right{background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.log-body{flex:1;overflow-y:auto;padding:8px}
.log-entry{margin-bottom:6px;border:1px solid var(--border);border-radius:5px;background:var(--bg3);animation:nin .2s}
.log-head{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--border)}
.log-step{font-size:9px;font-weight:700;color:var(--text3)}
.log-name{font-size:10px;font-weight:700;flex:1}
.log-arrow{font-size:9px;color:var(--text3)}
.log-vals{padding:6px 8px;display:flex;flex-direction:column;gap:3px}
.log-v{font-size:9px;padding:3px 5px;border-radius:2px;word-break:break-all;line-height:1.4}
.log-v.lin{background:rgba(0,212,255,.05);color:var(--cyan2);border-left:2px solid var(--cyan2)}
.log-v.lout{background:rgba(0,230,118,.05);color:var(--green2);border-left:2px solid var(--green2)}
.log-v.rdec{background:rgba(255,68,85,.05);color:var(--red);border-left:2px solid var(--red)}
.log-final{margin-top:6px;padding:10px;background:var(--bg);border:1px solid var(--border2);border-radius:5px}
.log-final-lbl{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:5px}
.log-final-val{font-size:10px;word-break:break-all;line-height:1.5}
.lenc{color:var(--green)}.ldec{color:var(--cyan)}
.log-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;opacity:.3;text-align:center;padding:16px}
.log-empty-ico{font-size:28px}
.log-empty-txt{font-size:9px;color:var(--text3);letter-spacing:1px;line-height:1.8}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(255,68,85,.12);border:1px solid var(--red);border-radius:6px;padding:8px 16px;font-size:11px;color:var(--red);z-index:999;animation:nin .2s;white-space:nowrap}
.overlay{position:fixed;inset:0;background:rgba(4,6,13,.88);display:flex;align-items:center;justify-content:center;z-index:500}
.modal{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:20px;width:440px;max-width:92vw;box-shadow:0 0 40px rgba(0,0,0,.9)}
.modal-title{font-size:12px;font-weight:700;letter-spacing:3px;color:var(--gold);margin-bottom:12px;text-transform:uppercase}
.modal-ta{width:100%;height:140px;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:8px;font-family:var(--mono);font-size:10px;color:var(--text);resize:none;outline:none;margin-bottom:10px}
.modal-acts{display:flex;gap:6px;justify-content:flex-end}
.mbtn{padding:6px 14px;border-radius:4px;font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border:1px solid;transition:all .2s}
.mbtn.pri{background:var(--gold);border-color:var(--gold);color:#000;font-weight:700}
.mbtn.pri:hover{background:var(--gold2)}
.mbtn.sec{background:transparent;border-color:var(--border2);color:var(--text2)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" stroke="#c9a84c" stroke-width="1.5" fill="none"/>
        <polygon points="16,7 23,11 23,21 16,25 9,21 9,11" stroke="#00d4ff" stroke-width="1" fill="none" opacity="0.6"/>
        <circle cx="16" cy="16" r="3" fill="#c9a84c" opacity="0.9"/>
      </svg>
      <div>
        <div class="logo-text">CIPHERSTACK</div>
        <div class="logo-sub">Cascade Encryption Builder</div>
      </div>
    </div>
    <div class="mode-group">
      <button class="mode-btn enc-on" id="btn-enc" onclick="setMode('encrypt')">&#128274; Encrypt</button>
      <button class="mode-btn" id="btn-dec" onclick="setMode('decrypt')">&#128275; Decrypt</button>
    </div>
    <div class="hdr-btns">
      <button class="hdr-btn" onclick="exportPipeline()">Export &uarr;</button>
      <button class="hdr-btn" onclick="openImport()">Import &darr;</button>
      <button class="hdr-btn red" onclick="clearPipeline()">Clear &#8635;</button>
    </div>
  </header>

  <aside class="panel-left">
    <div class="panel-title"><span class="ptdot"></span>Cipher Library</div>
    <div class="lib-scroll" id="lib"></div>
    <div class="stats-box">
      <div class="stat"><div class="stat-n cyan-n" id="stat-n">3</div><div class="stat-l">Nodes</div></div>
      <div class="stat"><div class="stat-n gold-n" id="stat-c">3</div><div class="stat-l">Config</div></div>
      <div class="stat stat-full" id="stat-v"></div>
    </div>
  </aside>

  <main class="canvas">
    <div class="canvas-inner" id="canvas-inner">
      <div class="empty-state" id="empty-state">
        <div class="empty-ico">&#9939;</div>
        <div class="empty-txt">Pipeline is empty<br>Click a cipher from the library to begin</div>
      </div>
      <div class="pipe" id="pipe" style="display:none"></div>
    </div>
    <div class="io-bar">
      <div class="io-sect">
        <div class="io-lbl" id="inp-lbl-wrap">
          <span id="inp-lbl" style="display:flex;align-items:center;gap:5px">
            <span class="io-dot" style="background:var(--green)"></span>Plaintext Input
          </span>
        </div>
        <textarea class="io-area" id="inp-area" placeholder="Enter plaintext to encrypt…" spellcheck="false">Hello, CipherStack!</textarea>
      </div>
      <div class="run-col">
        <button class="run-btn enc" id="run-btn" onclick="runPipeline()">&#128274;</button>
        <div class="run-lbl" id="run-lbl">Encrypt</div>
      </div>
      <div class="io-sect">
        <div class="io-lbl">
          <span id="out-lbl" style="display:flex;align-items:center;gap:5px">
            <span class="io-dot" style="background:var(--green)"></span>Encrypted Output
          </span>
          <button class="copy-btn" onclick="copyOut()">&#8853; Copy</button>
        </div>
        <textarea class="io-area out-enc" id="out-area" readonly placeholder="Output will appear here…"></textarea>
      </div>
    </div>
  </main>

  <aside class="panel-right">
    <div class="panel-title" style="color:var(--cyan)"><span class="ptdot" style="background:var(--cyan)"></span>Transform Log</div>
    <div class="log-body" id="log-body">
      <div class="log-empty">
        <div class="log-empty-ico">&#9673;</div>
        <div class="log-empty-txt">Run the pipeline to see<br>step-by-step transformations</div>
      </div>
    </div>
  </aside>
</div>

<script>
/* ═══════════════════════════════════
   CIPHERS
═══════════════════════════════════ */
const C={
  caesar:{id:'caesar',name:'Caesar Cipher',cfg:true,color:'#c9a84c',desc:'Shifts each letter by N positions.',
    def:{shift:3},fields:[{k:'shift',lbl:'Shift Amount',type:'range',min:-25,max:25,step:1}],
    enc(t,c){const n=((c.shift%26)+26)%26;return t.split('').map(ch=>{if(ch>='A'&&ch<='Z')return String.fromCharCode((ch.charCodeAt(0)-65+n)%26+65);if(ch>='a'&&ch<='z')return String.fromCharCode((ch.charCodeAt(0)-97+n)%26+97);return ch}).join('')},
    dec(t,c){return C.caesar.enc(t,{shift:-c.shift})}},
  xor:{id:'xor',name:'XOR Cipher',cfg:true,color:'#00d4ff',desc:'XORs each byte with a repeating key.',
    def:{key:'secret'},fields:[{k:'key',lbl:'Key String',type:'text',ph:'Enter key…'}],
    enc(t,c){const k=c.key||'k';return Array.from(t).map((ch,i)=>('0'+(ch.charCodeAt(0)^k.charCodeAt(i%k.length)).toString(16)).slice(-2)).join('')},
    dec(t,c){const k=c.key||'k';return(t.match(/.{1,2}/g)||[]).map((h,i)=>String.fromCharCode(parseInt(h,16)^k.charCodeAt(i%k.length))).join('')}},
  vigenere:{id:'vigenere',name:'Vigenere',cfg:true,color:'#9966ff',desc:'Polyalphabetic substitution via keyword.',
    def:{key:'cipher'},fields:[{k:'key',lbl:'Keyword',type:'text',ph:'Enter keyword…'}],
    enc(t,c){const k=(c.key||'a').toLowerCase().replace(/[^a-z]/g,'')||'a';let i=0;return t.split('').map(ch=>{if(ch>='A'&&ch<='Z'){const s=k.charCodeAt(i++%k.length)-97;return String.fromCharCode((ch.charCodeAt(0)-65+s)%26+65)}if(ch>='a'&&ch<='z'){const s=k.charCodeAt(i++%k.length)-97;return String.fromCharCode((ch.charCodeAt(0)-97+s)%26+97)}return ch}).join('')},
    dec(t,c){const k=(c.key||'a').toLowerCase().replace(/[^a-z]/g,'')||'a';let i=0;return t.split('').map(ch=>{if(ch>='A'&&ch<='Z'){const s=k.charCodeAt(i++%k.length)-97;return String.fromCharCode(((ch.charCodeAt(0)-65-s)+26)%26+65)}if(ch>='a'&&ch<='z'){const s=k.charCodeAt(i++%k.length)-97;return String.fromCharCode(((ch.charCodeAt(0)-97-s)+26)%26+97)}return ch}).join('')}},
  railfence:{id:'railfence',name:'Rail Fence',cfg:true,color:'#ff8844',desc:'Writes text zigzag across N rails.',
    def:{rails:3},fields:[{k:'rails',lbl:'Number of Rails',type:'range',min:2,max:8,step:1}],
    enc(t,c){const n=Math.max(2,c.rails);if(n>=t.length)return t;const r=Array.from({length:n},()=>[]);let ri=0,d=1;for(const ch of t){r[ri].push(ch);if(ri===n-1)d=-1;else if(ri===0)d=1;ri+=d}return r.flat().join('')},
    dec(t,c){const n=Math.max(2,c.rails),len=t.length;if(n>=len)return t;const pat=[];let ri=0,d=1;for(let i=0;i<len;i++){pat.push(ri);if(ri===n-1)d=-1;else if(ri===0)d=1;ri+=d}const rl=Array(n).fill(0);pat.forEach(x=>rl[x]++);const ra=[];let p=0;for(let i=0;i<n;i++){ra.push(t.slice(p,p+rl[i]).split(''));p+=rl[i]}const idx=Array(n).fill(0);return pat.map(x=>ra[x][idx[x]++]).join('')}},
  columnar:{id:'columnar',name:'Columnar Trans.',cfg:true,color:'#ff4455',desc:'Rearranges text by columns via keyword.',
    def:{key:'CIPHER'},fields:[{k:'key',lbl:'Column Keyword',type:'text',ph:'e.g. CIPHER'}],
    enc(t,c){const k=(c.key||'KEY').toUpperCase().replace(/[^A-Z]/g,'')||'KEY';const cols=k.length;const rows=Math.ceil(t.length/cols);const pad=t.padEnd(rows*cols,'_');const ord=[...k].map((ch,i)=>({ch,i})).sort((a,b)=>a.ch.localeCompare(b.ch)).map(x=>x.i);return ord.map(col=>{let s='';for(let r=0;r<rows;r++)s+=pad[r*cols+col];return s}).join('')},
    dec(t,c){const k=(c.key||'KEY').toUpperCase().replace(/[^A-Z]/g,'')||'KEY';const cols=k.length;const rows=Math.ceil(t.length/cols);const ord=[...k].map((ch,i)=>({ch,i})).sort((a,b)=>a.ch.localeCompare(b.ch)).map(x=>x.i);const grid=Array(cols).fill('');let p=0;ord.forEach(col=>{grid[col]=t.slice(p,p+rows);p+=rows});let res='';for(let r=0;r<rows;r++)for(let col=0;col<cols;col++)res+=grid[col][r]||'';return res.replace(/_+$/,'')}},
  atbash:{id:'atbash',name:'Atbash',cfg:false,color:'#00e676',desc:'Mirrors each letter A->Z, Z->A.',
    def:{},fields:[],
    enc(t){return t.split('').map(ch=>{if(ch>='A'&&ch<='Z')return String.fromCharCode(90-(ch.charCodeAt(0)-65));if(ch>='a'&&ch<='z')return String.fromCharCode(122-(ch.charCodeAt(0)-97));return ch}).join('')},
    dec(t){return C.atbash.enc(t)}},
  base64:{id:'base64',name:'Base64',cfg:false,color:'#88aaff',desc:'Encodes data as 64 printable ASCII chars.',
    def:{},fields:[],
    enc(t){try{return btoa(unescape(encodeURIComponent(t)))}catch(e){return btoa(t)}},
    dec(t){try{return decodeURIComponent(escape(atob(t)))}catch(e){return t}}},
  reverse:{id:'reverse',name:'Reverse String',cfg:false,color:'#cc44ff',desc:'Reverses character order (self-inverse).',
    def:{},fields:[],
    enc(t){return t.split('').reverse().join('')},
    dec(t){return t.split('').reverse().join('')}},
  substitution:{id:'substitution',name:'Substitution',cfg:true,color:'#ffcc00',desc:'Custom 26-char alphabet mapping.',
    def:{alphabet:'QWERTYUIOPASDFGHJKLZXCVBNM'},
    fields:[{k:'alphabet',lbl:'Substitution Alphabet (26 chars)',type:'text',ph:'QWERTYUIOPASDFGHJKLZXCVBNM'}],
    enc(t,c){const a=((c.alphabet||'QWERTYUIOPASDFGHJKLZXCVBNM').toUpperCase()+'ABCDEFGHIJKLMNOPQRSTUVWXYZ').slice(0,26);return t.split('').map(ch=>{if(ch>='A'&&ch<='Z')return a[ch.charCodeAt(0)-65]||ch;if(ch>='a'&&ch<='z')return(a[ch.charCodeAt(0)-97]||ch).toLowerCase();return ch}).join('')},
    dec(t,c){const std='ABCDEFGHIJKLMNOPQRSTUVWXYZ';const a=((c.alphabet||'QWERTYUIOPASDFGHJKLZXCVBNM').toUpperCase()+'ABCDEFGHIJKLMNOPQRSTUVWXYZ').slice(0,26);return t.split('').map(ch=>{if(ch>='A'&&ch<='Z'){const i=a.indexOf(ch);return i>=0?std[i]:ch}if(ch>='a'&&ch<='z'){const i=a.indexOf(ch.toUpperCase());return i>=0?std[i].toLowerCase():ch}return ch}).join('')}}
};
const ORDER=['caesar','xor','vigenere','railfence','columnar','atbash','base64','reverse','substitution'];

/* ═══════════════════════════════════
   STATE
═══════════════════════════════════ */
let nodes=[
  {id:1,type:'caesar',config:{shift:3},open:true},
  {id:2,type:'xor',config:{key:'phantom'},open:true},
  {id:3,type:'vigenere',config:{key:'cipher'},open:true}
];
let mode='encrypt', runLog=[], nid=10;

/* ═══════════════════════════════════
   LIB
═══════════════════════════════════ */
function buildLib(){
  document.getElementById('lib').innerHTML=ORDER.map(id=>{
    const d=C[id];
    return `<div class="cipher-chip" onclick="addNode('${id}')">
      <div class="chip-head">
        <div class="chip-dot" style="background:${d.color};box-shadow:0 0 5px ${d.color}88"></div>
        <span class="chip-name">${d.name}</span>
        <span class="chip-tag ${d.cfg?'tag-cfg':'tag-free'}">${d.cfg?'CFG':'FREE'}</span>
        <button class="chip-plus" onclick="event.stopPropagation();addNode('${id}')">+</button>
      </div>
      <div class="chip-desc">${d.desc}</div>
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════
   RENDER
═══════════════════════════════════ */
function render(){
  const pipe=document.getElementById('pipe');
  const empty=document.getElementById('empty-state');
  if(nodes.length===0){pipe.style.display='none';empty.style.display='flex'}
  else{pipe.style.display='flex';empty.style.display='none'}

  pipe.innerHTML='';
  nodes.forEach((nd,i)=>{
    const d=C[nd.type];
    const le=runLog.find(e=>e.id===nd.id);
    const open=nd.open!==false;
    const prev=le&&le.out?`<span class="nio-prev" title="${esc(le.out)}">${esc(le.out.slice(0,14))}${le.out.length>14?'…':''}</span>`:'';
    const fieldsHtml=d.fields.map(f=>{
      const val=nd.config[f.k]??'';
      const lbl=f.type==='range'?`${f.lbl} &mdash; ${val}`:f.lbl;
      if(f.type==='range'){
        return `<div class="cfg-row"><label class="cfg-lbl">${lbl}</label>
          <input class="cfg-in" type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${val}"
            oninput="cfgNode(${nd.id},'${f.k}',Number(this.value));this.previousElementSibling.textContent='${f.lbl} \u2014 '+this.value"/></div>`;
      }
      return `<div class="cfg-row"><label class="cfg-lbl">${lbl}</label>
        <input class="cfg-in" type="text" placeholder="${f.ph||''}" value="${esc(String(val))}"
          oninput="cfgNode(${nd.id},'${f.k}',this.value)"/></div>`;
    }).join('');

    const bodyHtml=open?`<div class="node-body">
      ${fieldsHtml}
      <div class="io-pane">
        <div class="io-tabs">
          <div class="io-tab first${le?.in?' lit':''}">Input</div>
          <div class="io-tab${le?.out?' lit':''}">Output</div>
        </div>
        <div class="io-vals">
          <div class="io-val iin${!le?.in?' dim':''}">${le?esc(le.in):'&mdash;'}</div>
          <div class="io-val iout${!le?.out?' dim':''}">${le?esc(le.out):'&mdash;'}</div>
        </div>
      </div>
    </div>`:'';

    const wrap=document.createElement('div');
    wrap.className='node-wrap';
    wrap.innerHTML=`<div class="node-card" style="border-color:${open?d.color+'33':'var(--border)'}">
      <div class="node-head" onclick="toggleNode(${nd.id})">
        <div class="nnum" style="background:${d.color}18;border-color:${d.color}55;color:${d.color}">${i+1}</div>
        <div class="ntitle" style="color:${d.color}">${d.name}</div>
        <div style="display:flex;gap:4px;align-items:center">${prev}
          <span class="nbadge ${d.cfg?'tag-cfg':'tag-free'}">${d.cfg?'CFG':'FREE'}</span>
        </div>
        <div class="nbtns" onclick="event.stopPropagation()">
          <button class="nbtn" onclick="moveNode(${i},-1)" ${i===0?'disabled':''}>&#8593;</button>
          <button class="nbtn" onclick="moveNode(${i},1)" ${i===nodes.length-1?'disabled':''}>&#8595;</button>
          <button class="nbtn del" onclick="removeNode(${i})">&#10005;</button>
        </div>
        <span class="nchev" style="transform:${open?'rotate(90deg)':'rotate(0deg)'}">&#9654;</span>
      </div>
      ${bodyHtml}
    </div>`;
    pipe.appendChild(wrap);

    if(i<nodes.length-1){
      const conn=document.createElement('div');conn.className='conn';
      conn.innerHTML='<div class="conn-line"></div><div class="conn-arr"></div>';
      pipe.appendChild(conn);
    }
  });

  updateStats();
  updateModeUI();
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function updateStats(){
  const valid=nodes.length>=3;
  const cfg=nodes.filter(n=>C[n.type].cfg).length;
  document.getElementById('stat-n').textContent=nodes.length;
  document.getElementById('stat-c').textContent=cfg;
  const sv=document.getElementById('stat-v');
  sv.innerHTML=valid
    ?`<div class="stat-n green-n">VALID</div><div class="stat-l">${nodes.length}-node chain ready</div>`
    :`<div class="stat-n red-n">INVALID</div><div class="stat-l">Need ${3-nodes.length} more node${3-nodes.length===1?'':'s'}</div>`;
}

function updateModeUI(){
  const enc=mode==='encrypt';
  document.getElementById('btn-enc').className='mode-btn'+(enc?' enc-on':'');
  document.getElementById('btn-dec').className='mode-btn'+(enc?'':' dec-on');
  const rb=document.getElementById('run-btn');
  rb.className='run-btn '+(enc?'enc':'dec');
  rb.innerHTML=enc?'&#128274;':'&#128275;';
  document.getElementById('run-lbl').textContent=enc?'Encrypt':'Decrypt';
  const ia=document.getElementById('inp-area');
  const oa=document.getElementById('out-area');
  ia.className='io-area'+(enc?'':' in-dec');
  ia.placeholder=enc?'Enter plaintext to encrypt\u2026':'Paste ciphertext to decrypt\u2026';
  oa.className='io-area '+(enc?'out-enc':'out-dec');
  document.getElementById('inp-lbl').innerHTML=`<span class="io-dot" style="background:${enc?'var(--green)':'var(--red)'}"></span>${enc?'Plaintext Input':'Ciphertext Input'}`;
  document.getElementById('out-lbl').innerHTML=`<span class="io-dot" style="background:${enc?'var(--green)':'var(--cyan)'}"></span>${enc?'Encrypted Output':'Decrypted Output'}`;
}

/* ═══════════════════════════════════
   ACTIONS
═══════════════════════════════════ */
function addNode(type){nodes.push({id:nid++,type,config:{...C[type].def},open:true});runLog=[];document.getElementById('out-area').value='';render()}
function removeNode(i){nodes.splice(i,1);runLog=[];document.getElementById('out-area').value='';render()}
function moveNode(i,dir){const j=i+dir;if(j<0||j>=nodes.length)return;[nodes[i],nodes[j]]=[nodes[j],nodes[i]];runLog=[];document.getElementById('out-area').value='';render()}
function toggleNode(id){const n=nodes.find(x=>x.id===id);if(n)n.open=!n.open;render()}
function cfgNode(id,key,val){const n=nodes.find(x=>x.id===id);if(n){n.config[key]=val;runLog=[];document.getElementById('out-area').value='';}}
function setMode(m){mode=m;runLog=[];document.getElementById('out-area').value='';document.getElementById('inp-area').value='';render();renderLog()}
function clearPipeline(){nodes=[];runLog=[];document.getElementById('out-area').value='';render();renderLog()}
function copyOut(){const v=document.getElementById('out-area').value;if(v){try{navigator.clipboard.writeText(v)}catch(e){}}}

function runPipeline(){
  if(nodes.length<3){toast('Pipeline requires at least 3 nodes');return}
  const src=document.getElementById('inp-area').value;
  if(!src.trim()){toast('Input is empty');return}
  try{
    const chain=mode==='encrypt'?nodes:[...nodes].reverse();
    const entries=[];let cur=src;
    for(const nd of chain){
      const d=C[nd.type],inp=cur;
      cur=mode==='encrypt'?d.enc(cur,nd.config):d.dec(cur,nd.config);
      entries.push({id:nd.id,name:d.name,color:d.color,in:inp,out:cur});
    }
    runLog=entries;
    document.getElementById('out-area').value=cur;
    renderLog();render();
  }catch(e){toast('Error: '+e.message)}
}

function renderLog(){
  const body=document.getElementById('log-body');
  if(runLog.length===0){
    body.innerHTML='<div class="log-empty"><div class="log-empty-ico">&#9673;</div><div class="log-empty-txt">Run the pipeline to see<br>step-by-step transformations</div></div>';
    return;
  }
  const enc=mode==='encrypt';
  body.innerHTML=runLog.map((e,i)=>`<div class="log-entry">
    <div class="log-head">
      <span class="log-step">#${i+1}</span>
      <span class="log-name" style="color:${e.color}">${e.name}</span>
      <span class="log-arrow">${enc?'&rarr;':'&larr;'}</span>
    </div>
    <div class="log-vals">
      <div class="log-v lin">IN: ${esc(e.in.length>60?e.in.slice(0,60)+'…':e.in)}</div>
      <div class="log-v lout${enc?'':' rdec'}">OUT: ${esc(e.out.length>60?e.out.slice(0,60)+'…':e.out)}</div>
    </div>
  </div>`).join('')+`<div class="log-final">
    <div class="log-final-lbl">${enc?'&#10022; Final Ciphertext':'&#10022; Recovered Plaintext'}</div>
    <div class="log-final-val ${enc?'lenc':'ldec'}">${esc(runLog[runLog.length-1].out)}</div>
  </div>`;
}

/* ═══════════════════════════════════
   IMPORT / EXPORT
═══════════════════════════════════ */
function exportPipeline(){
  const blob=new Blob([JSON.stringify({nodes},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='cipherstack.json';a.click();
  URL.revokeObjectURL(url);
}
function openImport(){
  const ov=document.createElement('div');ov.className='overlay';ov.id='modal-ov';
  ov.innerHTML=`<div class="modal">
    <div class="modal-title">Import Pipeline JSON</div>
    <textarea class="modal-ta" id="modal-ta" placeholder='{"nodes":[{"id":1,"type":"caesar","config":{"shift":3}},...]}'></textarea>
    <div class="modal-acts">
      <button class="mbtn sec" onclick="closeImport()">Cancel</button>
      <button class="mbtn pri" onclick="doImport()">Import</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
}
function closeImport(){const ov=document.getElementById('modal-ov');if(ov)ov.remove()}
function doImport(){
  try{
    const parsed=JSON.parse(document.getElementById('modal-ta').value);
    if(!parsed.nodes)throw new Error('Missing nodes');
    nodes=parsed.nodes;runLog=[];document.getElementById('out-area').value='';
    closeImport();render();renderLog();
  }catch(e){toast('Import failed: '+e.message)}
}

/* ═══════════════════════════════════
   TOAST
═══════════════════════════════════ */
let toastT;
function toast(msg){
  let el=document.getElementById('toast-el');
  if(!el){el=document.createElement('div');el.id='toast-el';el.className='toast';document.body.appendChild(el)}
  el.textContent=msg;el.style.display='block';
  clearTimeout(toastT);toastT=setTimeout(()=>el.style.display='none',3000);
}

/* ═══════════════════════════════════
   INIT
═══════════════════════════════════ */
buildLib();render();renderLog();
</script>
</body>
</html>
